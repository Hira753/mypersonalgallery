<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Memories - Zaibiiii 💖</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#FCEEF5] min-h-screen relative pb-20 font-sans">

  <!-- Soft Gradient Vignette -->
  <div class="pointer-events-none fixed inset-0 bg-gradient-to-b from-white/20 via-transparent to-[#D8A7B1]/10 z-0"></div>

  <!-- Main Gallery Container -->
  <main id="gallery-main" class="relative z-10 max-w-6xl mx-auto px-3 sm:px-6 py-8 md:py-12 transition-all duration-500">
    
    <!-- Header Title -->
    <header class="text-center mb-8 md:mb-12">
      <div class="mb-3 space-y-2">
        <span class="block text-[11px] uppercase tracking-[0.4em] text-[#991B47] font-bold opacity-100">
          Collection of Beautiful Moments
        </span>
        <div class="h-[1.5px] w-14 bg-[#991B47] mx-auto opacity-70"></div>
      </div>
      <h1 class="font-serif text-3xl sm:text-5xl md:text-6xl italic font-bold text-[#881337] mb-3 tracking-tight drop-shadow-sm">
        Memories with Hubby 💖
      </h1>
      <p class="font-sans text-xs sm:text-sm text-[#701A33] max-w-md mx-auto font-medium">
        Tap any picture to view full size.
      </p>
    </header>

    <!-- 30 PHOTO GALLERY GRID (STRICTLY 3 COLUMNS ON ALL SCREENS) -->
    <section>
      <div class="gallery-grid-container" id="gallery-grid">
        <!-- 30 Photos populated dynamically by script.js -->
      </div>
    </section>

    <!-- End of Gallery Button -->
    <div class="mt-14 md:mt-20 text-center relative z-20">
      <a 
        href="final.html"
        onclick="navigateTo('final.html'); return false;" 
        class="btn-luxury text-sm sm:text-base uppercase tracking-[0.2em] px-8 py-4.5 cursor-pointer shadow-xl relative z-10 pointer-events-auto inline-flex items-center justify-center text-decoration-none"
        id="final-surprise-btn">
        <span>🌸 One Last Surprise...</span>
      </a>
    </div>

  </main>

  <!-- WELCOME POPUP MODAL -->
  <div id="popup-backdrop" class="popup-backdrop">
    <div class="bg-white/95 backdrop-blur-md border border-white/90 rounded-3xl popup-modal p-6 sm:p-10 text-center relative shadow-[0_15px_50px_-10px_rgba(153,27,71,0.35)]">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-pink-100 flex items-center justify-center text-3xl shadow-inner">
        🫶
      </div>
      <h3 class="font-serif text-2xl sm:text-3xl italic font-bold text-[#881337] mb-3">
        Hey Hubby 🫶
      </h3>
      <p class="font-sans text-sm sm:text-base text-[#701A33] leading-relaxed mb-8 font-medium">
        I made this little surprise just for you.💋💗
      </p>
      <button id="popup-continue-btn" class="btn-luxury w-full py-4 text-sm uppercase tracking-[0.15em] font-medium">
        Continue →
      </button>
    </div>
  </div>

  <!-- LIGHTBOX FULLSCREEN MODAL -->
  <div id="lightbox-backdrop" class="lightbox-backdrop">
    <!-- Close Button -->
    <button id="lightbox-close" class="absolute top-5 right-5 text-white/90 hover:text-white bg-white/20 hover:bg-white/30 w-11 h-11 rounded-full flex items-center justify-center text-xl transition-all z-20 cursor-pointer">
      ✕
    </button>

    <!-- Prev Button -->
    <button id="lightbox-prev" class="absolute left-3 md:left-8 top-1/2 -translate-y-1/2 text-white/90 hover:text-white bg-white/20 hover:bg-white/30 w-11 h-11 rounded-full flex items-center justify-center text-2xl transition-all z-20 cursor-pointer">
      ‹
    </button>

    <!-- Next Button -->
    <button id="lightbox-next" class="absolute right-3 md:right-8 top-1/2 -translate-y-1/2 text-white/90 hover:text-white bg-white/20 hover:bg-white/30 w-11 h-11 rounded-full flex items-center justify-center text-2xl transition-all z-20 cursor-pointer">
      ›
    </button>

    <!-- Lightbox Content -->
    <div class="lightbox-content text-center">
      <img id="lightbox-img" src="" alt="" class="lightbox-img mb-4 hidden" referrerPolicy="no-referrer" />
      <video id="lightbox-video" src="" controls autoplay playsinline class="lightbox-img mb-4 hidden"></video>
      <div id="lightbox-title" class="font-serif italic text-xl sm:text-2xl font-semibold text-pink-100 mb-1"></div>
      <div id="lightbox-desc" class="font-sans text-xs sm:text-sm text-pink-200/90 max-w-lg mx-auto mb-2 font-light"></div>
      <div id="lightbox-counter" class="font-sans text-xs text-pink-300/70 font-light tracking-widest uppercase"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
